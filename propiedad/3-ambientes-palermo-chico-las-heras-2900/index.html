  const t = (k, v) => { let s = UI[k][IDX[lang]]; if (v) Object.keys(v).forEach((x) => { s = s.split('{' + x + '}').join(v[x]); }); return s; };
  const src = (p) => (/^(data:|https?:)/.test(p) ? p : ROOT + p);
  const here = () => (location.protocol.indexOf('http') === 0 && !/limainmobiliariaofc\.com$/.test(location.hostname)) ? location.origin + location.pathname : APT.url;
  const I = (b) => '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + b + '</svg>';
  const ICON = { bed: I('<path d="M3 19v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"/><path d="M3 15h18"/><path d="M7 9V7.5A1.5 1.5 0 0 1 8.5 6h3A1.5 1.5 0 0 1 13 7.5V9"/>'),
    bath: I('<path d="M4 12h16v2.5a4.5 4.5 0 0 1-4.5 4.5h-7A4.5 4.5 0 0 1 4 14.5V12z"/><path d="M6 12V6.5a2.5 2.5 0 0 1 5 0"/><path d="M7 19l-1 2M17 19l1 2"/>'),
    area: I('<path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/>'), home: I('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>') };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const renderDesc = (text) => {
    const blocks = String(text).split(/\n\s*\n/).map((b) => b.split('\n').map((x) => x.trim()).filter(Boolean)).filter((b) => b.length);
    if (blocks.length && blocks[0].length === 1 && blocks[0][0] === blocks[0][0].toUpperCase() && /[A-ZÁÉÍÓÚ]/.test(blocks[0][0])) blocks.shift();
    return blocks.map((b) => {
      const isList = (arr) => arr.length && arr.every((x) => /^[-*•]\s+/.test(x));
      let out = '', rest = b;
      if (b.length > 1 && b[0].length < 46 && !/[.:]$/.test(b[0]) && !/^[-*•]/.test(b[0]) && !/^[^\w\s]/.test(b[0])) { out += '<h3>' + esc(b[0]) + '</h3>'; rest = b.slice(1); }
      if (isList(rest)) return out + '<ul>' + rest.map((x) => '<li>' + esc(x.replace(/^[-*•]\s+/, '')) + '</li>').join('') + '</ul>';
      const items = rest.filter((x) => /^[-*•]\s+/.test(x)), plain = rest.filter((x) => !/^[-*•]\s+/.test(x));
      return out + (plain.length ? '<p>' + plain.map(esc).join('<br>') + '</p>' : '') + (items.length ? '<ul>' + items.map((x) => '<li>' + esc(x.replace(/^[-*•]\s+/, '')) + '</li>').join('') + '</ul>' : '');
    }).join('');
  };
  const show = (i) => {
    const g = APT.gallery; cur = (i + g.length) % g.length;
    const im = $('main'); im.src = src(g[cur]); im.alt = APT.i18n[lang].title + ' - ' + (cur + 1);
    $('count').textContent = (cur + 1) + ' / ' + g.length;
    [...$('thumbs').children].forEach((b, k) => { b.setAttribute('aria-current', k === cur ? 'true' : 'false'); });
    const cb = $('thumbs').children[cur]; if (cb && cb.scrollIntoView) { try { cb.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
    if (!$('lb').hidden) $('lbi').src = src(g[cur]);
  };
  const render = () => {
    const d = APT.i18n[lang];
    document.documentElement.lang = lang; document.title = d.title + ' | Lima Inmobiliaria';
    $('tBack').textContent = t('back'); $('back').setAttribute('aria-label', t('back')); $('tDesc').textContent = t('desc'); $('all').textContent = t('all');
    $('h1').textContent = d.title;
    $('loc').innerHTML = esc(d.street) + ', <b>' + esc(APT.hood) + '</b>';
    $('price').innerHTML = esc(d.price) + ' <small>' + esc(d.month) + '</small>';
    const tags = ['<span class="tag">' + esc(t('status')) + '</span>'];
    if (APT.featured) tags.unshift('<span class="tag feat">' + esc(t('feat')) + '</span>');
    if (APT.pet) tags.push('<span class="tag pet">' + esc(t(APT.pet === 'small' ? 'petsmall' : 'petok')) + '</span>');
    if (d.avail) tags.push('<span class="tag av">' + esc(d.avail) + '</span>');
    $('tags').innerHTML = tags.join('');
    const f = [];
    f.push('<span>' + ICON.home + esc(t('amb', { n: APT.amb })) + '</span>');
    if (APT.beds > 0) f.push('<span>' + ICON.bed + esc(APT.beds === 1 ? t('bed1') : t('bedn', { n: APT.beds })) + '</span>');
    if (APT.baths > 0) f.push('<span>' + ICON.bath + esc(APT.baths === 1 ? t('bath1') : t('bathn', { n: APT.baths })) + '</span>');
    if (APT.m2) f.push('<span>' + ICON.area + APT.m2 + ' m²</span>');
    $('facts').innerHTML = f.join('');
    $('descBody').innerHTML = renderDesc(d.desc);
    const u = here();
    $('wa').textContent = t('wa');
    $('wa').href = 'https://wa.me/5491127858950?text=' + encodeURIComponent(t('msg', { t: d.title, s: d.street + ', ' + APT.hood, p: d.price + ' ' + d.month, u: u }));
    $('tLink').textContent = t('link'); $('url').value = u; $('copy').textContent = t('copy');
    $('shareBtn').textContent = t('share');
    $('prev').setAttribute('aria-label', t('prev')); $('next').setAttribute('aria-label', t('next')); $('lbp').setAttribute('aria-label', t('prev')); $('lbn').setAttribute('aria-label', t('next')); $('lbx').setAttribute('aria-label', t('close'));
    document.querySelector('.langs').setAttribute('aria-label', t('lang'));
    document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.l === lang ? 'true' : 'false'));
    show(cur);
  };
  // galería
  APT.gallery.forEach((p, i) => {
    const b = document.createElement('button'); b.type = 'button'; const im = document.createElement('img'); im.src = src(p); im.alt = ''; im.loading = 'lazy'; b.appendChild(im);
    b.addEventListener('click', () => show(i)); $('thumbs').appendChild(b);
  });
  $('prev').addEventListener('click', (e) => { e.stopPropagation(); show(cur - 1); }); $('next').addEventListener('click', (e) => { e.stopPropagation(); show(cur + 1); });
  $('lbp').addEventListener('click', (e) => { e.stopPropagation(); show(cur - 1); }); $('lbn').addEventListener('click', (e) => { e.stopPropagation(); show(cur + 1); });
  $('stage').addEventListener('click', () => { $('lb').hidden = false; $('lbi').src = src(APT.gallery[cur]); $('lbx').focus(); });
  const closeLb = () => { $('lb').hidden = true; };
  $('lbx').addEventListener('click', closeLb); $('lb').addEventListener('click', (e) => { if (e.target === $('lb')) closeLb(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1); });
  let x0 = null; const sw = $('stage');
  sw.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  sw.addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); x0 = null; }, { passive: true });
  // idioma
  document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.l; try { localStorage.setItem('site-lang', lang); } catch (e) {} render(); }));
  // copiar / compartir
  const live = $('live');
  $('copy').addEventListener('click', async () => {
    const u = $('url').value;
    try { await navigator.clipboard.writeText(u); } catch (e) { $('url').select(); try { document.execCommand('copy'); } catch (er) {} }
    live.textContent = t('copied'); clearTimeout(live._t); live._t = setTimeout(() => { live.textContent = ''; }, 2500);
  });
  $('url').addEventListener('focus', () => $('url').select());
  if (navigator.share) { $('shareBtn').hidden = false; $('shareBtn').addEventListener('click', () => { navigator.share({ title: APT.i18n[lang].title, text: APT.i18n[lang].title, url: $('url').value }).catch(() => {}); }); }
  // volver (dentro de un iframe de vista previa)
  $('back').addEventListener('click', (e) => { if (window.parent !== window && location.protocol === 'about:') { e.preventDefault(); window.parent.postMessage({ lima: 'close' }, '*'); } });
  $('all').addEventListener('click', (e) => { if (window.parent !== window && location.protocol === 'about:') { e.preventDefault(); window.parent.postMessage({ lima: 'close' }, '*'); } });
  lang = pickLang(); render();
})();
</script>
